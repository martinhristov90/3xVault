---
# Dependabot configuration for 3xVault
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Terraform provider updates
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "semiannually"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 5
    reviewers:
      - "martinhristov90"
    assignees:
      - "martinhristov90"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps-terraform)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*" # Dependency name, for example AWS provider
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 5
    reviewers:
      - "martinhristov90"
    assignees:
      - "martinhristov90"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-github-actions)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"

  # Go modules (for tests) in case Terratest is implemented
  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 5
    reviewers:
      - "martinhristov90"
    assignees:
      - "martinhristov90"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]